<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lebanon Cedar Race 2026 — poster generator</title>
<!--
  Renders the downloadable social posts. Open with ?s=square | story | link
  and screenshot at the matching size:
    square 1080x1080  · Instagram / Facebook post      -> images/social/
    story  1080x1920  · Instagram / Facebook story      -> images/social/
    link   1200x630   · link previews, Facebook cover   -> images/social/
    wide   1920x1080  · the homepage banner             -> images/banners/
    tall   1080x1920  · the homepage banner on phones   -> images/banners/
  The two banner sizes drop the call to action: the site puts a real,
  clickable Register button over the artwork instead.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;font-family:'Baloo 2',sans-serif;position:relative;background:#000}
#photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,24,.72) 0%,rgba(8,16,24,.34) 26%,rgba(8,16,24,0) 46%)}
.bot{position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,16,24,.84) 0%,rgba(8,16,24,.45) 18%,rgba(8,16,24,0) 36%)}
.txt{position:absolute;z-index:5}
.date{font-weight:800;color:#FFD166;letter-spacing:.05em;text-shadow:0 3px 18px rgba(0,0,0,.55)}
.l1{font-weight:800;line-height:1.0;color:#fff;letter-spacing:.01em;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.l2{font-weight:800;line-height:1.1;background:linear-gradient(92deg,#FFC533,#FB8500);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 16px rgba(0,0,0,.55))}
.dist{display:inline-block;font-weight:800;color:#0B2B15;background:#8ECF3C;border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.cta{position:absolute;z-index:5}
.cta .pill{display:inline-block;font-weight:800;color:#fff;background:#F7A00A;border-radius:999px;
  box-shadow:0 12px 34px rgba(0,0,0,.45)}
/* Send people to the site, not straight to the registration system: the
   homepage carries the countdown, the route and the Register button.
   The url lines up with the WORDS in the button, not the button's edge. */
.cta .url{display:block;font-weight:700;color:#fff;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.7);opacity:.95}
/* organisers and partners: Batroun Race on top, the partner marks in one row
   beneath it. Every mark is reversed to white on transparency, so the row sits
   on the photo the way the wordmark does — no logo wearing its own coloured
   box in the middle of the artwork. The bottom scrim is what they read against. */
.brand{position:absolute;z-index:5;display:flex;flex-direction:column;gap:14px}
.brand .row{display:flex;align-items:center;gap:12px}
.brand img.mark{filter:drop-shadow(0 2px 10px rgba(0,0,0,.6))}
.brand span{color:#fff;font-weight:800;letter-spacing:.02em;text-shadow:0 2px 14px rgba(0,0,0,.7)}
.brand .partners img{display:block;width:auto;filter:drop-shadow(0 2px 12px rgba(0,0,0,.65))}

/* ---- Instagram / Facebook square ---- */
body.square{width:1080px;height:1080px}
body.square #photo{object-position:center 62%}
body.square .txt{left:64px;top:70px;right:64px}
body.square .date{font-size:40px}
body.square .l1{font-size:96px}
body.square .l2{font-size:62px}
body.square .dist{margin-top:18px;font-size:46px;padding:2px 36px}
body.square .cta{left:64px;bottom:80px}
body.square .cta .pill{font-size:42px;padding:10px 44px}
body.square .cta .url{margin-top:16px;padding-left:44px;font-size:29px}
/* the announcement line is longer than REGISTER NOW, and on the square the
   call to action and the lockup share one band — so it steps down to clear it */
body.square.soon .cta .pill{font-size:34px}
body.square .brand{right:64px;bottom:78px;align-items:flex-end}
body.square .brand img.mark{height:48px}
body.square .brand span{font-size:28px}
body.square .brand .partners{gap:22px}
body.square .brand .partners img{height:62px}

/* ---- Story / WhatsApp status ---- */
body.story{width:1080px;height:1920px}
body.story #photo{object-position:center 58%}
body.story .txt{left:64px;top:300px;right:64px}
body.story .date{font-size:40px}
body.story .l1{font-size:98px}
body.story .l2{font-size:62px}
body.story .dist{margin-top:24px;font-size:46px;padding:2px 38px}
body.story .cta{left:64px;bottom:540px}
body.story .cta .pill{font-size:44px;padding:12px 48px}
body.story .cta .url{margin-top:18px;padding-left:48px;font-size:30px}
body.story .brand{left:64px;bottom:300px;align-items:flex-start}
body.story .brand img.mark{height:50px}
body.story .brand span{font-size:29px}
body.story .brand .partners{gap:24px}
body.story .brand .partners img{height:68px}

/* ---- Link preview / Facebook post ---- */
body.link{width:1200px;height:630px}
body.link #photo{object-position:center 66%}
body.link .txt{left:56px;top:46px;right:56px}
body.link .date{font-size:28px}
body.link .l1{font-size:70px}
body.link .l2{font-size:44px}
body.link .dist{margin-top:12px;font-size:32px;padding:2px 26px}
body.link .cta{left:56px;bottom:46px}
body.link .cta .pill{font-size:28px;padding:8px 30px}
body.link .cta .url{margin-top:12px;padding-left:30px;font-size:21px}
body.link .brand{right:56px;bottom:46px;align-items:flex-end;gap:10px}
body.link .brand img.mark{height:36px}
body.link .brand span{font-size:22px}
body.link .brand .partners{gap:16px}
body.link .brand .partners img{height:46px}

/* ---- homepage banner, wide (16:9 so it fills a landscape screen) ----
   The lockup sits near the bottom edge, where it belongs: the page now
   climbs the whole banner, so there is nothing to keep clear of. */
body.wide{width:1920px;height:1080px}
body.wide #photo{object-position:center 72%}
body.wide .cta{display:none}
body.wide .txt{left:112px;top:150px}
body.wide .date{font-size:58px}
body.wide .l1{font-size:138px}
body.wide .l2{font-size:88px}
body.wide .dist{margin-top:22px;font-size:56px;padding:2px 40px}
body.wide .brand{right:96px;bottom:78px;align-items:flex-end;gap:16px}
body.wide .brand img.mark{height:64px}
body.wide .brand span{font-size:35px}
body.wide .brand .partners{gap:26px}
body.wide .brand .partners img{height:76px}

/* ---- homepage banner, phones ---- */
body.tall{width:1080px;height:1920px}
body.tall #photo{object-position:center 70%}
body.tall .cta{display:none}
body.tall .txt{left:64px;top:250px;right:64px}
body.tall .date{font-size:40px}
body.tall .l1{font-size:98px}
body.tall .l2{font-size:62px}
body.tall .dist{margin-top:26px;font-size:46px;padding:2px 38px}
body.tall .brand{right:64px;bottom:150px;align-items:flex-end;gap:18px}
body.tall .brand img.mark{height:74px}
body.tall .brand span{font-size:40px}
body.tall .brand .partners{gap:28px}
body.tall .brand .partners img{height:86px}
</style>
</head>
<body>
<img id="photo" src="../images/banners/tannourine-source.jpg" alt="">
<div class="top"></div>
<div class="bot"></div>
<div class="txt">
  <div class="date">13.9.2026 · TANNOURINE, LEBANON</div>
  <div class="l1">LEBANON CEDAR</div>
  <div class="l2">RACE 2026</div>
  <div><span class="dist">5 KM</span></div>
</div>
<div class="cta">
  <span class="pill">REGISTER NOW 🏃</span>
  <span class="url">www.batrounrace.com</span>
</div>
<div class="brand">
  <div class="row"><img class="mark" src="../images/logo-mark.png" alt=""><span>BATROUN RACE</span></div>
  <div class="row partners">
    <img src="../images/partners/routes-white.png" alt="Routes">
    <img src="../images/partners/tannourine-white.png" alt="Tannourine">
    <img src="../images/partners/tannourine-emblem-white.png" alt="Tannourine">
  </div>
</div>
<script>
var q = new URLSearchParams(location.search);
document.body.className = q.get('s') || 'square';
/* Two calls to action for the same artwork: the announcement posts that run
   before registration opens, and the register posts that run after. Add
   &cta=soon for the first — the site's clock is counting to the same moment. */
if (q.get('cta') === 'soon') {
  document.body.classList.add('soon');
  document.querySelector('.cta .pill').textContent = 'REGISTRATION OPENING SOON';
  // no date on the post: the site carries the clock, and a post cannot be
  // edited once it is out — the countdown can
  document.querySelector('.cta .url').textContent = 'www.batrounrace.com';
}
</script>
</body>
</html>
